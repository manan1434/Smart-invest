<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Profile</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-image: url("images/n.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .info-container {
            background-color: rgba(255, 255, 255, 0.9); /* Slight opacity for better readability */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 575px;
            max-width: 90%;
            backdrop-filter: blur(10px);
        }

        .info-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .info-container label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
            color: #333;
        }

        .info-container input[type="text"],
        .info-container input[type="number"],
        .info-container select {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .info-container button {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }

        .info-container button:hover {
            background-color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="info-container">
      <h2>Investment Profile</h2>
      <form action="/submit-info" method="POST">
  
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
  
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="100" required>
  
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
          <option value="">-- Select --</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
  
        <label for="education_level">Education Level:</label>
        <select id="education_level" name="education_level" required>
          <option value="">-- Select --</option>
          <option value="High School">High School</option>
          <option value="Graduate">Graduate</option>
          <option value="Post-Graduate">Post-Graduate</option>
          <option value="Doctorate">Doctorate</option>
        </select>
  
        <label for="annual_income">Annual Income (₹):</label>
        <input type="number" id="annual_income" name="annual_income" min="0" required>
  
        <label for="investment_amount">Investment Amount (₹):</label>
        <input type="number" id="investment_amount" name="investment_amount" min="0" required>
  
        <label for="financial_knowledge">Financial Knowledge (0-10):</label>
        <input type="number" id="financial_knowledge" name="financial_knowledge" min="0" max="10" required>
  
        <label for="risk_tolerance">Risk Tolerance (0-10):</label>
        <input type="number" id="risk_tolerance" name="risk_tolerance" min="0" max="10" required>
  
        <label for="investment_horizon">Investment Horizon:</label>
        <select id="investment_horizon" name="investment_horizon" required>
          <option value="">-- Select --</option>
          <option value="Short">Short</option>
          <option value="Medium">Medium</option>
          <option value="Long">Long</option>
        </select>
  
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>  
</html>
